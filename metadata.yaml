name: astrbot_plugin_shangbanzu
desc: |
  🏢 打工人·上班族物语 —— 大型群聊职场生存模拟游戏。

  以"上班族的现实"为主题：入职公司、每日打卡领工资（通勤+五险一金+迟到判定）、
  摸鱼被抓、加班猝死进医院还能攒调休券、被裁员拿补偿、写周报评绩效、
  和领导谈加薪、挤地铁通勤、交房租、吃外卖、买基金绿到发光、
  买股票追涨杀跌、团建购物两不误、攒够公积金全款买房安家；
  玩家之间方案评审式对线撕逼，亲自出战卷王大赛冲击"传奇卷王"段位。

  ## 特色
  - 💼 真实职场：116 家公司、12 级职级、晋升/跳槽/裁员/离职全流程
  - 📊 双状态条：健康值 + 精神值，加班掉血、吃饭回蓝，低健康加班有住院风险
  - 🎯 技能系统：5 种技能可学，影响加班收益和晋升成功率
  - 🏠 生活模拟：五险一金公积金、四种通勤、12 档住房、午休/团建/购物/摆摊副业
  - 🧾 工资条：收支流水明细，每一分钱都有出处
  - 📈 理财系统：银行存取利息 + 基金每日随机波动 + 100 支股票实时交易
  - 🪪 群昵称显示：OneBot v11 自动拉取群名片（QQ官方平台自动降级昵称）
  - 🖼️ 全文本 HTML 图片渲染，渲染失败自动回退纯文本
  - 🗄️ 数据备份：SQLite在线快照，指令与WebUI双入口管理
  - 🌐 内置独立端口 WebUI 面板（动态/排行/查询/备份/股市/公司/玩家管理，支持密码登录）
  - 💾 用户数据 SQLite 存储，游戏文本 JSON 可自行扩充

  ## 平台适配
  OneBot v11（aiocqhttp）与 QQ 官方机器人均已适配（仅使用文本/图片/@组件）。
